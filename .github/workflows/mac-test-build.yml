name: Test builds
# Scratch builds for testing: Sill.app signed ad hoc with its disk image, and the iPhone and iPad
# app unsigned (re-sign it with your own Apple ID to install). Not releases.
on:
  push:
    branches: [mac-test-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/select-xcode
        with:
          version: '27'
          fallback: 'false'
      - name: Build Sill.app (signed ad hoc) and its disk image
        run: |
          Scripts/make-app.sh
          app=.build/Sill.app
          codesign --verify --strict "$app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' -c 'Print :CFBundleVersion' "$app/Contents/Info.plist"
          Scripts/make-dmg.sh --sign - "$app" .build/Sill-mac-adhoc.dmg
          shasum -a 256 .build/Sill-mac-adhoc.dmg
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: .build/Sill-mac-adhoc.dmg
          archive: false
          retention-days: 14
          if-no-files-found: error
  ios:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/select-xcode
        with:
          version: '27.1'
          allow-beta: 'true'
      - name: Archive the iPhone and iPad app (Release, unsigned) as an .ipa
        run: |
          set -o pipefail
          xcodebuild -project iOSClient/Sill.xcodeproj -scheme Sill -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Sill.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" CODE_SIGNING_ALLOWED=NO archive | tail -5
          app="$RUNNER_TEMP/Sill.xcarchive/Products/Applications/Sill.app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' -c 'Print :CFBundleVersion' -c 'Print :DTPlatformVersion' "$app/Info.plist"
          echo "Keep Screen On in the binary: $(strings "$app/Sill" | grep -c 'Keep Screen On')"
          mkdir -p "$RUNNER_TEMP/ipa/Payload" && cp -R "$app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/Sill-ios-unsigned.ipa" Payload)
          shasum -a 256 Sill-ios-unsigned.ipa
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: Sill-ios-unsigned.ipa
          archive: false
          retention-days: 14
          if-no-files-found: error
